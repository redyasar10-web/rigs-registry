name: index

on:
  schedule:
    # Every 6 hours, offset off the hour to avoid GitHub's cron stampede.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "data/blocklist.json"
      - "bot/**"

# Never let two indexer runs write the repo at once.
concurrency:
  group: index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned deliberately. The indexer gates on `claude plugin validate`, so
      # an unpinned upgrade could change validation behaviour and mass-delist
      # the corpus overnight. Bump this on purpose, never implicitly.
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code@2.1.186

      - name: Verify the validator is usable headlessly
        run: |
          claude plugin validate --help > /dev/null
          echo "validator OK"

      - name: Run tests
        run: npm test

      - name: Index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_SIZE: "120"
        run: npm run index

      # Exit 3 is the canary: the run would have delisted >20% of the corpus,
      # so it refused to write. Surface it loudly instead of failing silently.
      - name: Handle canary abort
        if: failure()
        run: |
          echo "::warning::Indexer aborted or failed. If this was the canary (exit 3),"
          echo "::warning::a tooling change is the likely cause. Nothing was committed."

      - name: Commit index
        run: |
          git config user.name  "rigs-bot"
          git config user.email "rigs-bot@users.noreply.github.com"
          git add .claude-plugin/marketplace.json data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "index: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # The site renders data/index.json as committed here, so a freshly indexed
      # change stays invisible until something redeploys it. With no hook that is
      # silent staleness — the second half of the incident where the marketplace
      # and the site disagreed for days. Say so loudly rather than skipping quietly.
      #
      # The guard lives inside `run:` on purpose. It used to be
      # `if: success() && env.DEPLOY_HOOK != ''`, but step-level `env` is not in
      # scope for that same step's `if`, so the condition read an empty string and
      # the step never fired even when the secret WAS set.
      - name: Trigger site rebuild
        if: success()
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not configured, so the site will keep serving a stale index until it is set. See 'Site rebuilds' in README.md."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
          echo "site rebuild triggered"
